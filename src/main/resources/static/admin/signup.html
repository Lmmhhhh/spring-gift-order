<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <style>
        body   { font-family: sans-serif; padding: 40px; }
        input  { display: block; margin-bottom: 10px; padding: 8px; width: 300px; }
        button { padding: 8px 16px; }
        .link  { margin-top: 10px; }
    </style>
</head>
<body>
<h1>회원가입</h1>

<form id="signup-form">
    <input type="email"    id="email"    placeholder="이메일"    required>
    <input type="password" id="password" placeholder="비밀번호"  required>
    <button type="submit">가입</button>
</form>

<div class="link">
    이미 계정이 있나요? <a href="/admin/login.html">로그인</a>
</div>

<script>
    const form = document.getElementById("signup-form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!email || !password) return;

      try {
        // 1) 회원가입 요청
        const signResp = await fetch("/api/members/register", {
          method : "POST",
          headers: { "Content-Type": "application/json" },
          body   : JSON.stringify({ email, pwd: password })
        });
        if (!signResp.ok) {
          const msg = await signResp.text();
          throw new Error(msg || "회원가입 실패");
        }

        // 2) 자동 로그인 요청
        const loginResp = await fetch("/api/members/login", {
          method : "POST",
          headers: { "Content-Type": "application/json" },
          body   : JSON.stringify({ email, pwd: password })
        });
        if (!loginResp.ok) throw new Error("로그인 실패");

        const data = await loginResp.json();
        const token = data.token || data.accessToken;
        localStorage.setItem("accessToken", token);

        alert("회원가입 완료");
        window.location.href = "/admin/products/list";
      } catch (err) {
        alert("오류: " + err.message);
      }
    });
</script>
</body>
</html>
