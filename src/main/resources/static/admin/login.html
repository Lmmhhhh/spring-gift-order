<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>관리자 로그인</title>
    <style>
        body   { font-family: sans-serif; padding: 40px; }
        input  { display: block; margin-bottom: 10px; padding: 8px; width: 300px; }
        button { padding: 8px 16px; }
        .link  { margin-top: 10px; }
    </style>
</head>
<body>
<h1>관리자 로그인</h1>

<form id="login-form">
    <input type="email"    id="email"    placeholder="이메일"   required>
    <input type="password" id="password" placeholder="비밀번호" required>
    <button type="submit">로그인</button>
</form>

<div class="link">
    계정이 없나요? <a href="/admin/signup.html">회원가입</a>
</div>

<script>
    const form = document.getElementById("login-form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!email || !password) return;

      try {
        const resp = await fetch("/api/members/login", {
          method : "POST",
          headers: { "Content-Type": "application/json" },
          body   : JSON.stringify({ email, pwd: password })
        });

        if (!resp.ok) {
          const msg = await resp.text();
          throw new Error(msg || "로그인 실패");
        }

        const data = await resp.json();
        const token = data.token || data.accessToken;
        localStorage.setItem("accessToken", token);

        window.location.href = "/admin/products/list";
      } catch (err) {
        alert("에러: " + err.message);
      }
    });
</script>
</body>
</html>
